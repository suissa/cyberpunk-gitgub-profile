name: Generate profile SVGs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/profile_generator.py'
      - 'scripts/generate-profile.sh'
      - 'scripts/generate-profile.ps1'
      - 'examples/**/profile.json'
      - '.github/workflows/generate-profile.yml'

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --upgrade pip cairosvg
      - name: Generate and validate Marie Curie
        run: |
          python scripts/profile_generator.py examples/marie-curie/profile.json \
            --output examples/marie-curie/generated \
            --validate --render
      - name: Validate geometry with tests
        run: python -m unittest discover -s tests -v
      - name: Upload SVG and PNG previews
        uses: actions/upload-artifact@v4
        with:
          name: marie-curie-cyberpunk-profile
          path: examples/marie-curie/generated/
          if-no-files-found: error
